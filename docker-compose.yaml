networks:
  solace_msg_net:
    name: solace_msg_net
    external: false
    driver: bridge

services:
  # Jaeger
  jaeger:
    image: ${JAEGER_IMAGE}
    hostname: jaeger
    container_name: jaeger
    volumes:
      - ./jaeger-v2-config.yaml:/etc/jaeger/config.yaml
    environment:
      - SPAN_STORAGE_TYPE=memory
    command: 
      - "--config=/etc/jaeger/config.yaml"
    networks:
      - solace_msg_net
    ports:
      - "16685:16685"  # GRPC query service
      - "16686:16686"  # UI
      - "16687:16687"  # Admin port
      - "14268:14268"  # Jaeger thrift HTTP
      - "14250:14250"  # Jaeger GRPC
      - "4317:4317"    # OTLP GRPC (same as your collector uses)
      - "4318:4318"    # OTLP HTTP
    depends_on:
      solbroker:
        condition: service_healthy


  # Collector
  otel-collector:
    image: ${OTELCOL_IMG}
    command: ["--config=/etc/otel-collector-config.yaml", "${OTELCOL_ARGS}"]
    hostname: otelcollector
    container_name: otelcollector
    networks:
      - solace_msg_net
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "1888:1888"   # pprof extension
      - "4319:4317"   # OTLP gRPC receiver (different port to avoid conflict)
      - "4320:4318"   # OTLP HTTP receiver
      - "8888:8888"   # Prometheus metrics
      - "8889:8889"   # Prometheus exporter metrics
      - "13133:13133" # health_check extension
      - "55679:55679" # zpages extension
    depends_on:
      - jaeger


  solbroker:
    image: ${PUBSUB_IMAGE}
    hostname: solbroker
    container_name: solbroker
    networks:
      - solace_msg_net
    env_file:
      - ./solace_config_keys.env

    ports:
      - "2222:2222"
      - "8080:8080"
      - "55443:55443"
      - "55445:55445"
      - "${PUBSUB_PORT_NUMBER}:55555"
      - "55556:55556"
      - "5671:5671"
      - "5672:5672"
      - "5550:5550"
      - "1943:1943"
      - "8008:8008"
      - '5550:5550'     # HealthCheck
    shm_size: 2g
    ulimits:
      memlock: -1
      nofile:
        soft: 2448
        hard: 1048576
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5550/health-check/guaranteed-active"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
